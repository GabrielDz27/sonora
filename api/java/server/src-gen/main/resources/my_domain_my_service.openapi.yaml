components:
  securitySchemes:
    bearerAuth:
      name: Authorization 
      type: apiKey
      in: header
  schemas:
    tipoRelatorio:
      description: ""
      type: string
      enum:
        - PERIODO
        - MENSAL
        - ANUAL
      
    
    statusPeca:
      description: ""
      type: string
      enum:
        - PENDENTE
        - PROCESSO
        - FINALIZADO
        - MORTA
      
    
    statusMaquina:
      description: ""
      type: string
      enum:
        - ATIVO
        - MANUTENCAO
        - INATIVO
      
    
    turnoFuncionario:
      description: ""
      type: string
      enum:
        - PRIMEIRO
        - SEGUNDO
        - TERCEIRO
        - DIURNO
      
    
    userNotificationKind:
      description: "User notification kind."
      type: string
      enum:
        - Operational
        - Management
        - News
      
    
    userNotificationPriority:
      description: "User notification priority."
      type: string
      enum:
        - Error
        - Alert
        - None
      
    
    eventEmailFormat:
      description: "Format of the email"
      type: string
      enum:
        - HTML
        - PLAIN_TEXT
      
    
    fieldType:
      description: ""
      type: string
      enum:
        - BINARY
        - BOOLEAN
        - DATE
        - DATETIME
        - LOCALDATETIME
        - DOUBLE
        - ENUM
        - INTEGER
        - MONEY
        - STRING
        - TIME
      
    
    fileFormat:
      description: ""
      type: string
      enum:
        - CSV
        - FLAT
        - JSON
        - XML
      
    
    hookFunction:
      description: ""
      type: string
      enum:
        - BEFORE_PARSE
        - BEFORE_CONVERSION
        - ON_ERROR
        - VALIDATE
      
    
    eventType:
      description: ""
      type: string
      enum:
        - CHUNK
        - DOWNLOAD
        - ERROR
        - FINISH
        - START
      
    
    errorStrategy:
      description: ""
      type: string
      enum:
        - CALL_SCRIPT
        - IGNORE
        - STOP
      
    
    status:
      description: ""
      type: string
      enum:
        - DONE
        - DONE_WITH_ERRORS
        - DOWNLOADING
        - ERROR
        - NOT_STARTED
        - RUNNING
      
    
    errorType:
      description: ""
      type: string
      enum:
        - CONVERT_ERROR
        - SERVICE_ERROR
      
    retornoRelatorio:
      description: ""
      type: object
      required:
        - pecaMortas
      properties:
        maquinaTrabalhando:
          type: array
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/maquinaTrabalhando'
          description: ""
        pecaMortas:
          type: integer
          format: int64
          description: ""
          minimum: 0
        pecaFuncionario:
          type: array
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/pecaFuncionario'
          description: ""
    
    maquinaTrabalhando:
      description: ""
      type: object
      required:
        - horas
      properties:
        maquina:
          type: object
          allOf:
            - $ref: '#/components/schemas/maquina'
          description: ""
        horas:
          type: integer
          format: int64
          description: ""
          minimum: 0
    
    pecaFuncionario:
      description: ""
      type: object
      properties:
        peca:
          type: object
          allOf:
            - $ref: '#/components/schemas/peca'
          description: ""
        funcionario:
          type: object
          allOf:
            - $ref: '#/components/schemas/funcionario'
          description: ""
    
    retornoAtualizarStatus:
      description: ""
      type: object
      required:
        - mensagemRetorno
        - id
      properties:
        mensagemRetorno:
          type: string
          description: ""
        id:
          type: string
          description: ""
        contemErro:
          type: boolean
          description: ""
    
    peca:
      description: "Entidade da peça com as informações"
      type: object
      required:
        - nome
        - codigoDesenho
        - tempoEstimadoMinutos
        - status
        - valor
        - motivoPerda
      properties:
        id:
          type: string
          format: uuid
          description: "Identificador único UUID"
        nome:
          type: string
          maxLength: 100
          description: "Nome descritivo do item"
        codigoDesenho:
          type: string
          maxLength: 50
          description: "Referência técnica do projeto"
        tempoEstimadoMinutos:
          type: integer
          format: int64
          description: "Tempo previsto para fabricação"
        status:
          type: string
          allOf:
          - $ref: '#/components/schemas/statusPeca'
          description: "Estado atual: PENDENTE, PROCESSO, FINALIZADO, MORTA"
        valor:
          type: string
          description: "Valor da peça"
        motivoPerda:
          type: string
          description: "Motivo pela perda peça quando o status da peça é morta"
    
    funcionario:
      description: "Entidade do funcionário/operador"
      type: object
      required:
        - nome
        - matricula
        - cargo
        - turno
      properties:
        id:
          type: string
          format: uuid
          description: "Identificador único UUID"
        nome:
          type: string
          description: "Nome completo do colaborador"
        matricula:
          type: string
          maxLength: 20
          description: "Registro único na empresa"
        cargo:
          type: string
          description: "Função técnica na metalurgia"
        turno:
          type: string
          allOf:
          - $ref: '#/components/schemas/turnoFuncionario'
          description: "Turno: PRIMEIRO, SEGUNDO, TERCEIRO e DIURNO"
    
    maquina:
      description: "Entidade da máquina/equipamento"
      type: object
      required:
        - nome
        - status
      properties:
        id:
          type: string
          format: uuid
          description: "Identificador único UUID"
        nome:
          type: string
          description: "Nome de identificação do ativo"
        status:
          type: string
          allOf:
          - $ref: '#/components/schemas/statusMaquina'
          description: "Estado do ativo: ATIVO, MANUTENCAO, INATIVO"
    
    registroProducao:
      description: "Entidade mestre de apontamento e histórico"
      type: object
      required:
        - dataInicio
        - dataFinal
      properties:
        id:
          type: string
          format: uuid
          description: "Identificador único UUID"
        peca:
          type: object
          allOf:
            - $ref: '#/components/schemas/peca'
          description: "Relacionamento com a peça processada"
        funcionario:
          type: object
          allOf:
            - $ref: '#/components/schemas/funcionario'
          description: "Relacionamento com o operador responsável"
        maquina:
          type: object
          allOf:
            - $ref: '#/components/schemas/maquina'
          description: "Relacionamento com a máquina utilizada"
        dataInicio:
          type: string
          format: date-time
          description: "Data e hora do 'Play' na produção"
        dataFinal:
          type: string
          format: date-time
          description: "Data e hora do 'Stop' ou descarte"
    
    notifyUserEventPayload:
      description: "Represents a regular user event notification payload"
      discriminator: 
        propertyName: _discriminator
      type: object
      required:
        - notificationKind
        - notificationPriority
        - notificationSubject
        - notificationContent
        - sourceDomain
        - sourceService
        - destinationUser
        - _discriminator
      properties:
        notificationClass:
          type: string
          description: "Class of notification"
        notificationOrigin:
          type: string
          description: "Origin of notification. Free text. Optional."
        notificationKind:
          type: string
          allOf:
          - $ref: '#/components/schemas/userNotificationKind'
          description: "Notification kind."
        notificationPriority:
          type: string
          allOf:
          - $ref: '#/components/schemas/userNotificationPriority'
          description: "Notification priority."
        notificationSubject:
          type: string
