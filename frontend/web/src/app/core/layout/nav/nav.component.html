<aside class="w-72 bg-slate-900 text-white flex flex-col fixed h-full shadow-2xl z-40 border-r border-slate-800">

  <div class="p-8">
    <div class="flex items-center gap-3">
      <div class="h-8 w-8 bg-sky-500 rounded-lg grid place-items-center shadow-lg shadow-sky-500/20">
        <lucide-icon [img]="Box" class="size-5 text-slate-900"></lucide-icon>
      </div>
      <div>
        <h2 class="text-xl font-black tracking-tighter leading-none">METALX<span class="text-sky-500">.</span></h2>
        <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mt-1">Control System v2.0</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 px-4 space-y-2 mt-2">

    <p class="px-4 text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Menu Principal</p>

    <a routerLink="/inicio" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="LayoutDashboard" class="size-5"></lucide-icon>
      Dashboard
    </a>

    <a routerLink="/peca" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="Settings2" class="size-5"></lucide-icon>
      Catálogo de Peças
    </a>

    <a routerLink="/funcionario" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="Users" class="size-5"></lucide-icon>
      Colaboradores
    </a>

    <a routerLink="/maquina" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="Cpu" class="size-5"></lucide-icon>
      Máquinas
    </a>

    <a routerLink="/registro-producao" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="Activity" class="size-5"></lucide-icon>
      Monitor de Produção
    </a>

    <a routerLink="/relatorio" routerLinkActive="bg-slate-800 text-sky-400"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800/50 transition-all group text-slate-400 font-bold text-sm">
      <lucide-icon [img]="BarChart3" class="size-5"></lucide-icon>
      Relatório
    </a>
  </nav>

  @if (usuario()) {
  <div class="p-6 border-t border-slate-800 bg-slate-900/50">
    <div class="flex items-center gap-4 p-3 bg-slate-800/40 rounded-2xl border border-slate-800">
      <div class="relative">
        <div
          class="w-10 h-10 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-500 font-black text-sm border border-sky-500/20">
          {{ iniciais() }}
        </div>
        <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
      </div>
      <div class="overflow-hidden">
        <p class="text-xs font-black text-white truncate">{{ usuario()?.nome }}</p>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">{{ usuario()?.cargo || 'Operador' }}</p>
      </div>
      <button (click)="fazerLogout()" class="ml-auto text-slate-500 hover:text-white transition-colors">
        <lucide-icon [img]="LogOut" class="size-4"></lucide-icon>
      </button>
    </div>
  </div>
  } @else {
    <div class="p-6 border-t border-slate-800 text-center">
      <p class="text-[10px] text-slate-600 font-black uppercase tracking-widest">Aguardando Operador</p>
    </div>
  }
</aside>
