<div class="p-6 space-y-6">
  <div class="flex justify-between items-end border-b border-slate-200 pb-6">
    <div>
      <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Colaboradores</h1>
      <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Gestão de Operadores e Turnos</p>
    </div>
    
    <button (click)="abrirNovo()" 
            class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/20">
      <lucide-icon name="plus" class="size-4"></lucide-icon>
      ADICIONAR
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (func of lista(); track func.id) {
      <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm hover:border-sky-500 transition-all group">
        <div class="flex justify-between items-start mb-4">
          <div class="h-10 w-10 bg-slate-100 rounded-xl grid place-items-center text-slate-600 group-hover:bg-sky-50 group-hover:text-sky-600">
            <lucide-icon name="user" class="size-5"></lucide-icon>
          </div>
          <button (click)="abrirEditar(func)" class="text-slate-400 hover:text-slate-900 p-1">
            <lucide-icon name="edit-3" class="size-4"></lucide-icon>
          </button>
        </div>

        <h3 class="font-bold text-slate-900 uppercase text-sm">{{ func.nome }}</h3>
        <p class="text-[11px] text-slate-500 font-medium tracking-wide">{{ func.cargo }}</p>

        <div class="mt-4 pt-4 border-t border-slate-50 flex items-center justify-between">
          <span class="text-[10px] font-black px-2 py-1 bg-slate-100 rounded text-slate-600 uppercase">
            {{ func.turno }}
          </span>
          <span class="text-[10px] font-mono text-slate-400 italic">mat: {{ func.matricula }}</span>
        </div>
      </div>
    }
  </div>

  <app-modal 
    [exibir]="modalAberto()" 
    [titulo]="itemParaEdicao() ? 'Editar Colaborador' : 'Novo Colaborador'" 
    (fechar)="modalAberto.set(false)">
    
    <app-formulario-funcionario 
      [dadosIniciais]="itemParaEdicao()" 
      (salvar)="salvar($event)" 
      (cancelar)="modalAberto.set(false)">
    </app-formulario-funcionario>

  </app-modal>
</div>
