<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-industrial-blue">Equipa Operacional</h1>
      <p class="text-sm text-gray-500">Gestão de colaboradores e turnos</p>
    </div>
    <button (click)="modalAberto.set(true)" class="btn-primary">+ Novo Funcionário</button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-industrial-white text-gray-600 uppercase text-[10px] font-bold tracking-wider">
        <tr>
          <th class="px-6 py-4">Matrícula</th>
          <th class="px-6 py-4">Nome / Cargo</th>
          <th class="px-6 py-4">Turno</th>
          <th class="px-6 py-4">Status</th>
          <th class="px-6 py-4 text-right">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        @for (f of funcionarios(); track f.id) {
          <tr class="hover:bg-gray-50/50 transition">
            <td class="px-6 py-4 font-mono text-sm text-gray-600">{{ f.matricula }}</td>
            <td class="px-6 py-4">
              <div class="font-bold text-gray-800">{{ f.nome }}</div>
              <div class="text-xs text-gray-500">{{ f.cargo }}</div>
            </td>
            <td class="px-6 py-4">
              <span class="text-xs font-medium px-2 py-1 rounded bg-slate-100 border border-slate-200">
                {{ f.turno }}
              </span>
            </td>
            <td class="px-6 py-4">
              @if (f.ativo) {
                <span class="flex items-center gap-1.5 text-green-600 text-xs font-bold">
                  <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Ativo
                </span>
              } @else {
                <span class="flex items-center gap-1.5 text-gray-400 text-xs font-bold">
                  <span class="w-2 h-2 bg-gray-300 rounded-full"></span> Inativo
                </span>
              }
            </td>
            <td class="px-6 py-4 text-right space-x-4">
              <button (click)="editar(f)" class="text-industrial-blue hover:text-blue-800 text-sm font-semibold">Editar</button>
              <button (click)="deletar(f.id)" class="text-red-500 hover:text-red-700 text-sm font-semibold">Excluir</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-modal [exibir]="modalAberto()" [titulo]="'Ficha de Funcionário'" (fechar)="modalAberto.set(false)">
  <app-funcionario-form (salvar)="onSalvar($event)" (cancelar)="modalAberto.set(false)" />
</app-modal>
