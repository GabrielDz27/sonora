<div class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden bg-slate-950">
  
  <div class="absolute inset-0 opacity-20 pointer-events-none bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] [background-size:40px_40px]"></div>
  <div class="absolute inset-0 bg-gradient-to-tr from-slate-950 via-slate-950/80 to-sky-900/20"></div>

  <div class="relative z-10 w-full max-w-md">
    <div class="rounded-3xl border border-slate-800 bg-white shadow-2xl overflow-hidden">
      
      <div class="px-8 py-8 border-b border-slate-100">
        <div class="flex items-center gap-4">
          <div class="h-14 w-14 rounded-2xl bg-slate-900 grid place-items-center shadow-lg border border-slate-700">
            <lucide-icon [img]="ShieldCheck" class="size-7 text-sky-400"></lucide-icon>
          </div>
          <div>
            <div class="flex items-center">
              <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase">Metal</h1>
              <h1 class="text-2xl font-light text-sky-600 tracking-tighter uppercase">X</h1>
            </div>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-black">Terminal de Acesso</p>
          </div>
        </div>
      </div>

      <div class="p-8">
        @if (errorMsg) {
          <div class="mb-6 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 flex items-center gap-3 animate-in fade-in slide-in-from-top-2">
            <lucide-icon [img]="AlertCircle" class="size-4 text-red-600"></lucide-icon>
            <p class="text-xs font-bold text-red-700">{{ errorMsg }}</p>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
          <div>
            <label class="flex items-center gap-2 text-[11px] font-black text-slate-500 mb-2 uppercase tracking-widest">
              <lucide-icon [img]="User" class="size-3.5"></lucide-icon>
              Identificação do Operador
            </label>
            <input 
              formControlName="username" 
              type="email" 
              placeholder="id@metalx.com" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all bg-slate-50/50"
              [class.border-red-300]="form.get('username')?.touched && form.get('username')?.invalid" 
            />
          </div>

          <div>
            <label class="flex items-center gap-2 text-[11px] font-black text-slate-500 mb-2 uppercase tracking-widest">
              <lucide-icon [img]="Key" class="size-3.5"></lucide-icon>
              Chave de Segurança
            </label>
            <input 
              formControlName="password" 
              type="password" 
              placeholder="••••••••" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all bg-slate-50/50"
              [class.border-red-300]="form.get('password')?.touched && form.get('password')?.invalid" 
            />
          </div>

          <button 
            type="submit" 
            [disabled]="loading" 
            class="w-full rounded-2xl bg-slate-900 text-white mt-4 px-4 py-4 font-bold text-sm hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xl shadow-slate-900/30 flex items-center justify-center gap-3 uppercase tracking-widest"
          >
            @if (!loading) {
              <span>Autenticar</span>
              <lucide-icon [img]="ArrowRight" class="size-4 text-sky-400"></lucide-icon>
            } @else {
              <span>Verificando...</span>
              <lucide-icon [img]="Loader2" class="size-4 animate-spin"></lucide-icon>
            }
          </button>

          <div class="pt-4 text-center">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tight">
              Acesso restrito a pessoal autorizado
            </p>
          </div>
        </form>
      </div>
    </div>

    <div class="mt-8 text-center space-y-2">
      <p class="text-xs text-slate-500 font-medium">
        Problemas com sua credencial? <span class="text-sky-500 hover:underline cursor-pointer">Contate o Suporte TI</span>
      </p>
    </div>
  </div>
</div>
