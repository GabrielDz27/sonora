<div class="p-8 space-y-8 bg-slate-50/50 min-h-screen">
  
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
    <div>
      <h1 class="text-3xl font-black text-slate-900 uppercase tracking-tighter">Parque de Ativos</h1>
      <p class="text-sm text-slate-500 font-bold uppercase tracking-widest flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-sky-500"></span>
        Monitoramento de Equipamentos
      </p>
    </div>

    <div class="flex gap-4">
      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4 min-w-[160px]">
        <div class="h-10 w-10 bg-emerald-50 text-emerald-600 rounded-xl grid place-items-center">
          <lucide-icon name="check-circle" class="size-5"></lucide-icon>
        </div>
        <div>
          <p class="text-[10px] font-black text-slate-400 uppercase">Operacionais</p>
          <p class="text-xl font-black text-slate-900">{{ totalAtivas() }}</p>
        </div>
      </div>

      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4 min-w-[160px]">
        <div class="h-10 w-10 bg-amber-50 text-amber-600 rounded-xl grid place-items-center">
          <lucide-icon name="wrench" class="size-5"></lucide-icon>
        </div>
        <div>
          <p class="text-[10px] font-black text-slate-400 uppercase">Manutenção</p>
          <p class="text-xl font-black text-slate-900">{{ totalManutencao() }}</p>
        </div>
      </div>

      <button (click)="abrirNovo()" 
              class="bg-slate-900 text-white px-8 rounded-2xl font-bold text-sm flex items-center gap-2 hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/20">
        <lucide-icon name="plus" class="size-5"></lucide-icon>
        ADICIONAR MÁQUINA
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    @for (maquina of lista(); track maquina.id) {
      <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl hover:border-sky-500/50 transition-all group">
        
        <div [class]="'h-1.5 w-full ' + (maquina.status === 'ATIVO' ? 'bg-emerald-500' : 'bg-amber-500')"></div>

        <div class="p-6">
          <div class="flex justify-between items-start mb-6">
            <div [class]="'h-12 w-12 rounded-2xl grid place-items-center ' + 
              (maquina.status === 'ATIVO' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600')">
              <lucide-icon [name]="maquina.status === 'ATIVO' ? 'cpu' : 'alert-triangle'" class="size-6"></lucide-icon>
            </div>
            
            <div class="flex gap-2">
              <button (click)="abrirEditar(maquina)" class="p-2 text-slate-400 hover:bg-slate-100 rounded-lg transition-colors">
                <lucide-icon name="edit-3" class="size-4"></lucide-icon>
              </button>
              <button (click)="excluir(maquina.id!)" class="p-2 text-slate-400 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors">
                <lucide-icon name="trash-2" class="size-4"></lucide-icon>
              </button>
            </div>
          </div>

          <h3 class="text-lg font-black text-slate-900 uppercase tracking-tight group-hover:text-sky-600 transition-colors">
            {{ maquina.nome }}
          </h3>
          
          <div class="mt-4 space-y-3">
            <div class="flex justify-between items-center text-[11px] font-bold uppercase tracking-widest text-slate-400">
              <span>Status Operacional</span>
              <span [class]="maquina.status === 'ATIVO' ? 'text-emerald-600' : 'text-amber-600'">
                {{ maquina.status }}
              </span>
            </div>
            
            <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
              <div [class]="'h-full rounded-full ' + (maquina.status === 'ATIVO' ? 'bg-emerald-500 w-[92%]' : 'bg-amber-500 w-[40%]')"></div>
            </div>
          </div>

          <div class="mt-6 pt-6 border-t border-slate-50 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <lucide-icon name="barcode" class="size-4 text-slate-300"></lucide-icon>
              <span class="text-[10px] font-mono text-slate-400 uppercase tracking-tighter">REF: {{ maquina.id?.substring(0,8) }}</span>
            </div>
            <button class="text-[10px] font-black text-sky-600 uppercase tracking-widest hover:underline">Ver Histórico</button>
          </div>
        </div>
      </div>
    }
  </div>

  <app-modal 
    [exibir]="modalAberto()" 
    [titulo]="itemParaEdicao() ? 'Atualizar Equipamento' : 'Novo Equipamento'" 
    (fechar)="modalAberto.set(false)">
    
    <app-formulario-maquina 
      [dadosIniciais]="itemParaEdicao()" 
      (salvar)="salvar($event)" 
      (cancelar)="modalAberto.set(false)">
    </app-formulario-maquina>

  </app-modal>
</div>
