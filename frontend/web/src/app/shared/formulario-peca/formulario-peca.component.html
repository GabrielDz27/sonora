<form [formGroup]="pecaForm" (ngSubmit)="enviar()" class="space-y-5">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    
    <div class="md:col-span-2">
      <label class="block text-xs font-black text-slate-500 mb-1 uppercase tracking-widest">Identificação da Peça</label>
      <input type="text" formControlName="nome" placeholder="Ex: Eixo Traseiro Reforçado"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
    </div>

    <div>
      <label class="block text-xs font-black text-slate-500 mb-1 uppercase tracking-widest">Cód. Desenho Técnico</label>
      <input type="text" formControlName="codigoDesenho" placeholder="DES-102"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all font-mono">
    </div>

    <div>
      <label class="block text-xs font-black text-slate-500 mb-1 uppercase tracking-widest">Tempo Est. (min)</label>
      <div class="relative">
        <input type="number" formControlName="tempoEstimadoMinutos"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
        <span class="absolute right-4 top-3.5 text-slate-400 text-xs font-bold">MIN</span>
      </div>
    </div>

    <div>
      <label class="block text-xs font-black text-slate-500 mb-1 uppercase tracking-widest">Custo da Peça (R$)</label>
      <input type="number" formControlName="valor" placeholder="0.00"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
    </div>

    <div>
      <label class="block text-xs font-black text-slate-500 mb-1 uppercase tracking-widest">Fluxo de Produção</label>
      <select formControlName="status" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
        <option value="PENDENTE"> Pendente</option>
        <option value="PROCESSO"> Em Processo</option>
        <option value="FINALIZADO"> Finalizado</option>
        <option value="MORTA"> Morta (Sucata)</option>
      </select>
    </div>

    @if (pecaForm.get('status')?.value === 'MORTA') {
      <div class="md:col-span-2 p-4 bg-red-50 rounded-xl border border-red-100 animate-in fade-in slide-in-from-top-2 duration-300">
        <label class="block text-xs font-black text-red-700 mb-2 uppercase tracking-widest">Relatório de Descarte (Motivo)</label>
        <textarea formControlName="motivoPerda" rows="2"
                  placeholder="Descreva o motivo da perda ou falha no processo..."
                  class="w-full rounded-lg border border-red-200 px-4 py-2 text-sm text-red-900 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all"></textarea>
      </div>
    }
  </div>

  <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-slate-100">
    <button type="button" (click)="cancelar.emit()" 
            class="px-6 py-3 rounded-xl text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors">
      Cancelar
    </button>
    <button type="submit" [disabled]="pecaForm.invalid"
            class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-xl shadow-slate-900/30 hover:bg-slate-800 disabled:opacity-50 transition-all flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
      Registrar Peça
    </button>
  </div>
</form>
