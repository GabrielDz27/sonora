<app-modal [exibir]="modalAberto()" [titulo]="'Gerenciar Peça'" (fechar)="fecharModal()">
  <form [formGroup]="pecaForm" (ngSubmit)="salvar()" class="space-y-4">
    
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700">Nome da Peça</label>
        <input type="text" formControlName="nome" class="input-field" placeholder="Ex: Eixo Traseiro">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Código do Desenho</label>
        <input type="text" formControlName="codigoDesenho" class="input-field" placeholder="DES-102">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Valor (R$)</label>
        <input type="number" formControlName="valor" class="input-field" placeholder="0.00">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Tempo Estimado (min)</label>
        <input type="number" formControlName="tempoEstimadoMinutos" class="input-field">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Status</label>
        <select formControlName="status" class="input-field">
          <option value="PENDENTE">Pendente</option>
          <option value="PROCESSO">Em Processo</option>
          <option value="FINALIZADO">Finalizado</option>
          <option value="MORTA">Morta (Sucata)</option>
        </select>
      </div>
    </div>

    @if (pecaForm.get('status')?.value === 'MORTA') {
      <div class="animate-md-fade-in">
        <label class="block text-sm font-medium text-red-600">Motivo da Perda</label>
        <textarea formControlName="motivo_perda" class="input-field border-red-300 focus:ring-red-500" rows="3"></textarea>
      </div>
    }

    <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
      <button type="button" (click)="fecharModal()" class="btn-secondary">Cancelar</button>
      <button type="submit" class="btn-primary">Salvar Peça</button>
    </div>
  </form>
</app-modal>
