<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-6">
  
  <div class="space-y-5">
    
    <div class="relative">
      <label class="flex items-center gap-2 text-xs font-black text-slate-500 mb-2 uppercase tracking-widest">
        <lucide-icon [img]="iconUser" class="size-4 text-sky-600"></lucide-icon>
        Operador Responsável
      </label>
      <select formControlName="funcionarioId" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3.5 text-slate-900 bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all appearance-none">
        <option value="">Selecione o operador...</option>
        @for (f of funcionarios(); track f.id) {
          <option [value]="f.id">{{ f.nome }}</option>
        }
      </select>
    </div>

    <div class="relative">
      <label class="flex items-center gap-2 text-xs font-black text-slate-500 mb-2 uppercase tracking-widest">
        <lucide-icon [img]="iconMachine" class="size-4 text-sky-600"></lucide-icon>
        Equipamento / Máquina
      </label>
      <select formControlName="maquinaId" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3.5 text-slate-900 bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all appearance-none">
        <option value="">Selecione a máquina...</option>
        @for (m of maquinas(); track m.id) {
          <option [value]="m.id">{{ m.nome }}</option>
        }
      </select>
    </div>

    <div class="relative">
      <label class="flex items-center gap-2 text-xs font-black text-slate-500 mb-2 uppercase tracking-widest">
        <lucide-icon [img]="iconPart" class="size-4 text-sky-600"></lucide-icon>
        Peça para Produção
      </label>
      <select formControlName="pecaId" 
              class="w-full rounded-xl border border-slate-200 px-4 py-3.5 text-slate-900 bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all appearance-none">
        <option value="">Selecione o desenho técnico...</option>
        @for (p of pecas(); track p.id) {
          <option [value]="p.id">{{ p.codigoDesenho }} - {{ p.nome }}</option>
        }
      </select>
    </div>

  </div>

  <div class="flex items-center gap-4 p-4 bg-slate-900 rounded-2xl text-white shadow-lg">
    <div class="h-10 w-10 rounded-xl bg-sky-500/20 grid place-items-center text-sky-400">
      <lucide-icon name="clock" class="size-5"></lucide-icon>
    </div>
    <div class="flex-1">
      <p class="text-[10px] font-bold uppercase tracking-tighter text-sky-400">Time Tracking</p>
      <p class="text-sm font-medium">Início automático: <span class="text-sky-100">{{ dataAtual | date:'HH:mm' }}</span></p>
    </div>
  </div>

  <div class="flex items-center gap-3 pt-4">
    <button type="button" (click)="cancelar.emit()" 
            class="flex-1 px-6 py-4 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition-all">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid"
            class="flex-[2] bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold text-sm shadow-xl shadow-emerald-900/20 hover:bg-emerald-700 disabled:opacity-50 transition-all flex items-center justify-center gap-2">
      <lucide-icon name="play-circle" class="size-5"></lucide-icon>
      INICIAR AGORA
    </button>
  </div>
</form>
