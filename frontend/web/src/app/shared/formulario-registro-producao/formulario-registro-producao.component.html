<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-4">
      <div class="grid grid-cols-1 gap-4">
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Operador Responsável</label>
          <select formControlName="funcionario" class="input-field">
            <option [ngValue]="null">Selecione o operador...</option>
            @for (f of funcionarios(); track f.id) {
              <option [ngValue]="f.id">{{ f.nome }} ({{ f.matricula }})</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Equipamento / Máquina</label>
          <select formControlName="maquina" class="input-field">
            <option [ngValue]="null">Selecione a máquina...</option>
            @for (m of maquinas(); track m.id) {
              <option [ngValue]="m.id">{{ m.nome }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Peça para Produção</label>
          <select formControlName="peca" class="input-field">
            <option [ngValue]="null">Selecione a peça...</option>
            @for (p of pecas(); track p.id) {
              <option [ngValue]="p.id">{{ p.codigoDesenho }} - {{ p.nome }}</option>
            }
          </select>
        </div>

        <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg">
          <p class="text-xs text-blue-700 font-semibold uppercase">Atenção:</p>
          <p class="text-xs text-blue-600 italic">O carimbo de data/hora de início será gerado automaticamente ao salvar.</p>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
        <button type="button" (click)="cancelar.emit()" class="btn-secondary">Cancelar</button>
        <button type="submit" [disabled]="form.invalid" class="btn-primary bg-green-600 hover:bg-green-700">
          ▶ Iniciar Produção
        </button>
      </div>
    </form>
