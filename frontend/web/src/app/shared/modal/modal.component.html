@if (exibir()) {
<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div
    class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-200 border border-slate-200">

    <div class="bg-slate-900 px-6 py-4 flex justify-between items-center text-white">
      <div class="flex items-center gap-3">
        <lucide-icon name="layers" class="size-5 text-sky-400"></lucide-icon>
        <h3 class="text-sm font-black uppercase tracking-widest">{{ titulo() }}</h3>
      </div>

      <button (click)="fechar.emit()"
        class="hover:bg-white/10 rounded-lg p-1.5 transition-all text-slate-400 hover:text-white">
        <lucide-icon name="x" class="size-5"></lucide-icon>
      </button>
    </div>

    <div class="p-8">
      <ng-content></ng-content>
    </div>
  </div>
</div>
}
